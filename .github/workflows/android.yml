name: Build Android APK

# Builds the Brilla Android apps (signed with the permanent Brilla key) and publishes it
# to the "android-latest" GitHub Release on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The runner already has the Android SDK; just make sure the platform this app targets is installed.
      - name: Android SDK platform 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      # Every build is signed with the same permanent key, so new APKs install over old ones.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Signing key secrets are missing (ANDROID_KEYSTORE_BASE64)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
      # Family app
      - run: npm run build:app
      - run: npx cap sync android
      - name: Build Brilla APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk brilla.apk
      # Admin app
      - run: npm run build:admin
      - run: APP=admin npx cap sync android
      - name: Build Brilla Admin APK
        working-directory: android-admin
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android-admin/app/build/outputs/apk/release/app-release.apk brilla-admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: brilla-apks
          path: |
            brilla.apk
            brilla-admin.apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest brilla.apk brilla-admin.apk \
            --title "Brilla Android (latest test build)" \
            --notes "Installable test APKs built from ${GITHUB_SHA::7}: brilla.apk (families) and brilla-admin.apk (admin + Voice studio). Data is saved on each phone only and payments are in test mode." \
            --prerelease
